<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepak Chaudhary | Frontend Developer Portfolio</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Devicon & FontAwesome Links for Logos -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --primary: #0052FF;
            --dark-bg: #000E29;
            --light-bg: #F4F7FE;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --white: #FFFFFF;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--white);
            border-bottom: 1px solid #E2E8F0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark-bg);
            text-decoration: none;
        }
        .logo span { color: var(--primary); }

        .menu-icon {
            font-size: 1.4rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            background-color: var(--dark-bg);
            color: var(--white);
            padding: 4rem 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2.5rem;
        }

        .hero-text h3 {
            color: var(--primary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        .hero-text h1 {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero-text p {
            color: #94A3B8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            max-width: 550px;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            transition: 0.3s;
        }

        .btn-blue {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-outline {
            border: 1px solid #334155;
            color: var(--white);
        }

        /* Side Code Box */
        .dev-box {
            background-color: #021131;
            border: 1px solid #1E293B;
            border-radius: 8px;
            padding: 1.5rem;
            font-family: monospace;
            font-size: 0.95rem;
        }

        .dev-box .tag { color: #64748B; display: block; }
        .dev-box ul {
            list-style: none;
            padding-left: 1.5rem;
            margin: 0.5rem 0;
        }
        .dev-box li {
            color: var(--white);
            margin-bottom: 0.5rem;
            position: relative;
        }
        .dev-box li::before {
            content: "•";
            color: var(--primary);
            position: absolute;
            left: -1rem;
            font-size: 1.2rem;
        }

        /* Sections Common */
        section {
            padding: 4rem 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.8rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .section-heading {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        .about-text p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .about-details {
            background-color: var(--light-bg);
            padding: 1.5rem;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .detail-item i {
            color: var(--primary);
            font-size: 1rem;
            width: 20px;
            text-align: center;
        }

        /* Skills Section Grid Layout */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .skill-card {
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--white);
        }

        .skill-card i {
            font-size: 1.5rem;
        }

        .skill-info h5 {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .skill-info p {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* Portfolio Section */
        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .project-card {
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--white);
            box-shadow: var(--card-shadow);
        }

        .project-img {
            background: linear-gradient(135deg, #0A2540, #0052FF);
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.1);
            font-size: 3rem;
        }

        .project-info {
            padding: 1.2rem;
        }

        .project-info h4 {
            margin-bottom: 0.5rem;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .project-info p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            height: 40px;
        }

        .project-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Education Layout */
        .edu-box {
            border-left: 3px solid var(--primary);
            padding-left: 1.5rem;
            margin-left: 0.5rem;
            position: relative;
            background: var(--white);
        }

        .edu-box::before {
            content: "";
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            left: -8px;
            top: 4px;
        }

        .edu-box h4 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .edu-box p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .edu-box .date {
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
        }

        /* Contact Section */
        .contact-box {
            background-color: var(--light-bg);
            padding: 2rem 1.5rem;
            border-radius: 8px;
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .social-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 0.9rem;
            background: var(--white);
        }

        .btn-submit {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        footer {
            background-color: var(--dark-bg);
            color: #94A3B8;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.8rem;
        }
